services:
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  chroma:
    image: chromadb/chroma:1.0.8
    container_name: demo-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma

  ecommerce-service:
    build:
      context: ./ecommerce-backend
    container_name: ecommerce-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-agent_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_PROFILES_ACTIVE: debug
      AGENT_SERVICE_AUTH_TOKEN: ${AGENT_SERVICE_AUTH_TOKEN:-debug-agent-service}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  mysql-data:
  chroma-data:
